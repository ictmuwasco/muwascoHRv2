name: MUWASCO HR System - CI/CD Pipeline

# NOTE: "on" is quoted because unquoted `on:` is parsed as boolean `true`
# by YAML 1.1 parsers (VS Code / yamllint), which breaks schema validation.
# GitHub Actions accepts both `on:` and `"on":` identically.
"on":
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'phase*/**'
      - 'chore/**'
      - 'fix/**'
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality & Security Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer, phpcs, phpstan

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      # ---- PSR-4 autoload compliance (case-exact paths) ------------------
      # Windows dev machines resolve autoload paths case-insensitively, but CI
      # (and production) does not. A directory whose casing differs from its
      # namespace - e.g. Database\Seeders\* living in backend/database/seeders/ -
      # makes Composer silently SKIP the class ("does not comply with psr-4 ...
      # Skipping") and every consumer dies with a bare "Class not found".
      # --strict-psr turns that case mismatch into a loud, named build failure
      # here instead of a confusing runtime error later. (Re-applied after it
      # was stripped alongside the PHP 8.3 bump; it is independent of the bump.)
      - name: PSR-4 autoload compliance (case-exact paths)
        run: composer dump-autoload --optimize --strict-psr --no-interaction

      # ---- BLOCKING GATE 1: PHP syntax validation (Phase 1 / F-01) -------
      # A syntax-invalid PHP file must never reach production.
      - name: PHP syntax check (php -l)
        run: |
          set -e
          FILES=$(git ls-files '*.php')
          test -n "$FILES"
          echo "$FILES" | xargs -n 1 -P 4 php -l > /dev/null
          echo "PHP syntax OK for $(echo "$FILES" | wc -l) files"

      # ---- BLOCKING GATE 2: secret detection (Phase 1 / F-02) ------------
      # Fails the build when real credentials are committed.
      - name: Secret scan
        run: php scripts/ci/secret_scan.php

      # ---- Dependency vulnerabilities (advisory until triaged) -----------
      - name: Dependency security audit
        run: composer audit
        continue-on-error: true

      # ---- Style / static analysis ---------------------------------------
      # Advisory for now: the codebase predates PSR12 enforcement. Promote to
      # blocking in Phase 2 once existing findings are triaged. The blocking
      # security gates above (syntax, secrets, tests) must never be masked.
      - name: Run PHP Code Sniffer
        run: vendor/bin/phpcs --standard=PSR12 --extensions=php backend/app/ --ignore=vendor/
        continue-on-error: true

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse backend/app/ --level=6 --no-progress
        continue-on-error: true

  frontend-quality:
    name: Frontend Lint, Type-check & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Prettier format check
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css}"
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript type-check
        run: npm run typecheck
        working-directory: frontend

      - name: Run frontend tests
        run: |
          # Run vitest only when test files actually exist; otherwise skip gracefully.
          # (Do NOT grep package.json for the word "test" - package.json always
          # contains a "test" script, which makes the old guard always-true and
          # then `vitest run` fails on missing setupFiles / zero test files.)
          if [ -n "$(find src -name '*.test.*' -o -name '*.spec.*' 2>/dev/null)" ]; then
            echo "Tests found - running npm test..."
            npm run test -- --passWithNoTests
          else
            echo "No frontend test files found - skipping npm test (test suite not configured or removed)"
          fi
        working-directory: frontend

      - name: Build for production
        run: npm run build
        working-directory: frontend

  tests:
    name: Run Tests
    needs: quality
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: muwasco
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, mysqli, pdo_mysql, intl
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Dump optimized autoloader (CI classmap refresh)
        run: composer dump-autoload --optimize --strict-psr --no-interaction

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -proot --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
            if [ "$i" = "30" ]; then echo "MySQL never became ready" >&2; exit 1; fi
          done

      # ---- Run database migrations to create tables --------------------
      - name: Prepare storage dirs
        run: mkdir -p backend/storage/logs backend/storage/cache backend/storage/backups

      - name: Run database migrations
        run: php backend/database/run.php
        env:
          DB_DATABASE: muwasco
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306

      # ---- Run security permission seeder (grants catalog modules to hr_manager) ----
      # Uses backend/database/seed.php (dedicated runner with proper error
      # reporting) instead of an inline `php -r` one-liner, whose YAML/bash/PHP
      # triple-quoting is fragile and swallows the real error.
      - name: Run SecurityPermissionsSeeder
        run: php backend/database/seed.php SecurityPermissionsSeeder
        env:
          DB_DATABASE: muwasco
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306

                             
      - name: Run PHPUnit tests
        run: |
          set -eo pipefail
          # `|| true` keeps `set -e` from aborting when neither dir exists yet,
          # and `tr -d '[:space:]'` strips wc's padding so the -gt test is safe.
          TESTS=$(find backend/tests tests -name '*Test.php' -type f 2>/dev/null | wc -l | tr -d '[:space:]') || true
          CONFIG=""
          if [ -f "phpunit.xml.dist" ]; then CONFIG="phpunit.xml.dist";
          elif [ -f "backend/phpunit.xml.dist" ]; then CONFIG="backend/phpunit.xml.dist";
          elif [ -f "backend/phpunit.xml" ]; then CONFIG="backend/phpunit.xml";
          fi
          if [ "$TESTS" -gt 0 ]; then
            if [ -n "$CONFIG" ]; then
              echo "Found $TESTS test file(s) - running PHPUnit with $CONFIG..."
              vendor/bin/phpunit -c "$CONFIG" --no-coverage --do-not-cache-result 2>&1 | tee /tmp/phpunit_full.log
            else
              echo "Found $TESTS test file(s) - running PHPUnit with auto-discovered config..."
              vendor/bin/phpunit --no-coverage --do-not-cache-result 2>&1 | tee /tmp/phpunit_full.log
            fi
          else
            echo "No *Test.php files found - skipping PHPUnit (test suite is not tracked in this repo)"
            echo "PHPUnit skipped - no tests to run" > /tmp/phpunit_full.log
          fi
        env:
          DB_DATABASE: muwasco
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          APP_ENV: testing
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          JWT_ISSUER: muwasco-hr-system

      - name: Show phpunit log
        if: always()
        run: |
          echo '--- phpunit log ---'
          if [ -f /tmp/phpunit_full.log ]; then
            tail -n 250 /tmp/phpunit_full.log || true
          else
            echo "No phpunit log found (tests were skipped)"
          fi

      - name: Dump error log on failure
        if: failure()
        run: |
          echo '--- storage/logs ---'
          ls -la backend/storage/logs/ || true
          for f in backend/storage/logs/*.log; do echo "===== $f ====="; tail -n 100 "$f" || true; done
          echo '--- phpunit log (if tests ran) ---'
          if [ -f /tmp/phpunit_full.log ]; then
            echo "===== /tmp/phpunit_full.log ====="
            tail -n 100 /tmp/phpunit_full.log || true
          fi

  deploy-production:
    name: Deploy to Production
    needs: [quality, tests, frontend-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install production dependencies (backend)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend for production
        # NOTE: GitHub expressions do NOT support `||` fallbacks, so the old
        # `${{ secrets.VITE_API_URL || '...' }}` was a syntax error. Reference
        # the secret directly; empty is fine (Vite falls back to its default).
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy via FTP/SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            backend/tests/**
            frontend/assets/js/**/*.map
            *.md