name: MUWASCO HR System - CI/CD Pipeline

# NOTE: "on" is quoted because unquoted `on:` is parsed as boolean `true`
# by YAML 1.1 parsers (VS Code / yamllint), which breaks schema validation.
# GitHub Actions accepts both `on:` and `"on":` identically.
"on":
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'phase*/**'
      - 'chore/**'
      - 'fix/**'
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality & Security Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer, phpcs, phpstan

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      # ---- PSR-4 autoload compliance (case-exact paths) ------------------
      # Windows dev machines resolve autoload paths case-insensitively, but CI
      # (and production) does not. A directory whose casing differs from its
      # namespace - e.g. Database\Seeders\* living in backend/database/seeders/ -
      # makes Composer silently SKIP the class ("does not comply with psr-4 ...
      # Skipping") and every consumer dies with a bare "Class not found".
      # --strict-psr turns that case mismatch into a loud, named build failure
      # here instead of a confusing runtime error later. (Re-applied after it
      # was stripped alongside the PHP 8.3 bump; it is independent of the bump.)
      - name: PSR-4 autoload compliance (case-exact paths)
        run: composer dump-autoload --optimize --strict-psr --no-interaction

      # ---- BLOCKING GATE 1: PHP syntax validation (Phase 1 / F-01) -------
      # A syntax-invalid PHP file must never reach production.
      - name: PHP syntax check (php -l)
        run: |
          set -e
          FILES=$(git ls-files '*.php')
          test -n "$FILES"
          echo "$FILES" | xargs -n 1 -P 4 php -l > /dev/null
          echo "PHP syntax OK for $(echo "$FILES" | wc -l) files"

      # ---- BLOCKING GATE 2: secret detection (Phase 1 / F-02) ------------
      # Fails the build when real credentials are committed.
      - name: Secret scan
        run: php scripts/ci/secret_scan.php

      # ---- Dependency vulnerabilities (advisory until triaged) -----------
      - name: Dependency security audit
        run: composer audit
        continue-on-error: true

      # ---- Style / static analysis ---------------------------------------
      # Advisory for now: the codebase predates PSR12 enforcement. Promote to
      # blocking in Phase 2 once existing findings are triaged. The blocking
      # security gates above (syntax, secrets, tests) must never be masked.
      - name: Run PHP Code Sniffer
        run: vendor/bin/phpcs --standard=PSR12 --extensions=php backend/app/ --ignore=vendor/
        continue-on-error: true

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse backend/app/ --level=6 --no-progress
        continue-on-error: true

  frontend-quality:
    name: Frontend Lint, Type-check & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Prettier format check
        run: npx prettier --check "src/**/*.{js,jsx,ts,tsx,css}"
        working-directory: frontend

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: TypeScript type-check
        run: npm run typecheck
        working-directory: frontend

      - name: Run frontend tests
        run: |
          # Run vitest only when test files actually exist; otherwise skip gracefully.
          # (Do NOT grep package.json for the word "test" - package.json always
          # contains a "test" script, which makes the old guard always-true and
          # then `vitest run` fails on missing setupFiles / zero test files.)
          if [ -n "$(find src -name '*.test.*' -o -name '*.spec.*' 2>/dev/null)" ]; then
            echo "Tests found - running npm test..."
            npm run test -- --passWithNoTests
          else
            echo "No frontend test files found - skipping npm test (test suite not configured or removed)"
          fi
        working-directory: frontend

      - name: Build for production
        run: npm run build
        working-directory: frontend

  tests:
    name: Run Tests
    needs: quality
    runs-on: ubuntu-latest

    # MariaDB 10.4 — MUST match production.
    # Production runs MariaDB 10.4.32 (XAMPP/local + deploy target). This
    # project uses MariaDB-only DDL in several migrations, e.g.
    #   ALTER TABLE ... ADD COLUMN IF NOT EXISTS
    # which MySQL 8.0 does not accept. CI previously ran mysql:8.0, so
    # run.php had to SKIP those migrations there (see $ciSkipped), meaning
    # CI validated a *different schema* than production. Aligning the engine
    # removes that divergence and lets the skip list be emptied.
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: muwasco
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, mysqli, pdo_mysql, intl
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress --no-interaction

      - name: Dump optimized autoloader (CI classmap refresh)
        run: composer dump-autoload --optimize --strict-psr --no-interaction

      - name: Install MariaDB client
        run: |
          set -euo pipefail
          # The runner image ships NO mysql/mariadb client. The apt package list
          # for ubuntu-24.04 contains sqlite3 and netcat but neither
          # mysql-client nor mariadb-client, so `mariadb-admin ping` (and the
          # equally absent `mysqladmin`) both fail with "command not found".
          # The service health check and this wait step then fail even when the
          # container is perfectly healthy.
          #
          # Evidence: the "Wait for MariaDB to be ready" step started and
          # completed within the same second, which is only possible via the
          # `command -v mariadb-admin` guard, never via the 120s poll loop.
          #
          # Pin an exact version so a runner image change cannot silently
          # alter the client under us.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            mariadb-client=1:10.11.14-0ubuntu0.24.04.1 || \
          sudo apt-get install -y --no-install-recommends mariadb-client
          command -v mariadb-admin
          mariadb-admin --version

      - name: Wait for MariaDB to be ready
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            if mariadb-admin ping -h 127.0.0.1 -P 3306 -u root -proot --silent 2>/dev/null; then
              echo "MariaDB is ready after ${i} attempt(s)"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::MariaDB never became ready after 60 attempts (120s)."
              echo "--- last ping attempt, stderr shown:"
              mariadb-admin ping -h 127.0.0.1 -P 3306 -u root -proot 2>&1 || true
              exit 1
            fi
            echo "Waiting for MariaDB... ($i/60)"
            sleep 2
          done

      - name: Show engine version
        run: |
          set -e
          mariadb -h 127.0.0.1 -u root -proot -e "SELECT VERSION() AS engine_version;"

      # ---- Run database migrations to create tables --------------------
      - name: Prepare storage dirs
        run: mkdir -p backend/storage/logs backend/storage/cache backend/storage/backups

      # ---- Prove the app can actually reach the database before migrating ----
      # run.php exits with a bare "FATAL: ..." on connection failure, which is
      # indistinguishable from a genuine migration error. This makes the two
      # separate, so a future credential or service problem is named rather
      # than investigated as a schema fault.
      - name: Verify database connectivity
        run: |
          set -euo pipefail
          php -r '
            require "backend/bootstrap.php";
            try {
              $c = \App\Helpers\Database::getInstance()->getConnection();
              $r = $c->query("SELECT VERSION() v, DATABASE() d");
              $row = $r->fetch_assoc();
              echo "Connected to " . $row["d"] . " on " . $row["v"] . PHP_EOL;
            } catch (Throwable $e) {
              fwrite(STDERR, "::error::cannot connect to the CI database: " . $e->getMessage() . PHP_EOL);
              exit(1);
            }
          '
        env:
          DB_DATABASE: muwasco
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306

      # ---- MANDATORY pre-migration backup (see docs/DATABASE_ARCHITECTURE.md)
      # run.php applies DROP TABLE / ALTER TABLE / TRUNCATE statements with no
      # recovery path of its own. Snapshot first so a bad migration is always
      # reversible. `set -euo pipefail` makes a failed dump abort the job
      # rather than silently continuing into a destructive migration.
      - name: Backup database before migrations
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d_%H%M%S)
          OUT="backend/storage/backups/ci_pre_migration_${STAMP}.sql"
          mariadb-dump -h 127.0.0.1 -u root -proot \
            --single-transaction --routines --triggers --events \
            --default-character-set=utf8mb4 muwasco > "$OUT"
          test -s "$OUT" || { echo "Backup is empty - aborting" >&2; exit 1; }
          echo "Backup written: $OUT ($(du -h "$OUT" | cut -f1))"

      - name: Run database migrations
        run: php backend/database/run.php
        env:
          # These deliberately do NOT use ${{ secrets.* }}. The CI database is
          # an ephemeral service container defined in this file, with its
          # credentials in the `services:` block above (root/root). A missing
          # secret expands to an empty string, and bootstrap's env() treats
          # '' as unset, so DB_USERNAME silently became "root" and
          # DB_PASSWORD became "" - the connection was rejected and run.php
          # died in well under a second, before executing a single migration.
          # That is why the step failed instantly and repeatedly while passing
          # perfectly on a developer machine.
          #
          # The service is torn down with the job, so these are not production
          # credentials and belong in the workflow, not in repository secrets.
          DB_DATABASE: muwasco
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306

      # ---- Run security permission seeder (grants catalog modules to hr_manager) ----
      # Uses backend/database/seed.php (dedicated runner with proper error
      # reporting) instead of an inline `php -r` one-liner, whose YAML/bash/PHP
      # triple-quoting is fragile and swallows the real error.
      - name: Run SecurityPermissionsSeeder
        run: php backend/database/seed.php SecurityPermissionsSeeder
        env:
          DB_DATABASE: muwasco
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306

      - name: Run PHPUnit tests
        run: |
          set -eo pipefail
          # The previous version printed "PHPUnit skipped - no tests to run"
          # and exited 0 when no *Test.php files existed, so a repository with
          # zero tests reported a green test job. Fail instead: an empty suite
          # is a gap that must be visible, not a pass.
          TESTS=$(find backend/tests tests -name '*Test.php' -type f 2>/dev/null | wc -l | tr -d '[:space:]') || true
          if [ "$TESTS" -eq 0 ]; then
            echo "ERROR: no *Test.php files found. The test job must not pass vacuously." >&2
            exit 1
          fi
          echo "Found $TESTS test file(s)"

          # backend/phpunit.xml.dist is the tracked config. The gitignored
          # backend/phpunit.xml is a local developer override and never
          # reaches CI, so .dist is preferred when both somehow exist.
          CONFIG=""
          if [ -f "phpunit.xml.dist" ]; then CONFIG="phpunit.xml.dist";
          elif [ -f "backend/phpunit.xml.dist" ]; then CONFIG="backend/phpunit.xml.dist";
          elif [ -f "backend/phpunit.xml" ]; then CONFIG="backend/phpunit.xml";
          fi
          if [ -z "$CONFIG" ]; then
            echo "ERROR: no PHPUnit configuration found (expected backend/phpunit.xml.dist)." >&2
            exit 1
          fi

          echo "Running PHPUnit with $CONFIG"
          # `set -o pipefail` plus `| tee` already propagates PHPUnit's exit
          # code, but the output only lives in the log stream, which needs
          # admin rights to read through the API. On failure the captured log
          # is therefore (a) echoed into the step and (b) uploaded as a job
          # artifact, so the cause is readable either way. Previously the step
          # gave no indication of WHY it stopped, which is what made this
          # undiagnosable without log access.
          RC=0
          vendor/bin/phpunit -c "$CONFIG" --no-coverage --do-not-cache-result 2>&1 | tee /tmp/phpunit_full.log || RC=${PIPESTATUS[0]}

          # Always upload, pass or fail: a green run's output is the evidence
          # that the suite really executed rather than silently skipping.
          cp /tmp/phpunit_full.log backend/phpunit_output.log 2>/dev/null || true
          echo "--- environment actually visible to PHP ---"
          php -r 'foreach (["DB_HOST","DB_PORT","DB_DATABASE","DB_USERNAME","APP_ENV","CI","GITHUB_ACTIONS"] as $k) { printf("%s=%s\n", $k, var_export(getenv($k), true)); }'

          if [ "$RC" -ne 0 ]; then
            echo "::error::PHPUnit exited $RC. Full output follows (also saved as the phpunit-output artifact)."
            cat /tmp/phpunit_full.log || true
            exit 1
          fi
          echo "PHPUnit passed."
        env:
          # Same ephemeral service container as the migration steps: the
          # credentials live in this workflow's `services:` block, not in
          # repository secrets. See the comment there for why an unset secret
          # silently produced an empty DB_PASSWORD.
          DB_DATABASE: muwasco
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          APP_ENV: testing
          # Must stay STABLE across runs or PHPUnit's per-run token signatures
          # become incomparable. CI-only value, not a production secret.
          # This is a fixed literal, NOT a repository secret: an unset secret
          # expands to an empty string, App\Config\ConfigValidator rejects a
          # blank/known-default JWT_SECRET, and the suite dies during
          # bootstrap. It is an ephemeral test database - the value is never
          # used to sign a production token - so there is nothing to protect.
          JWT_SECRET: ci-only-not-a-real-secret-2f7b41c9e8a5
          JWT_ISSUER: muwasco-hr-system

      - name: Upload PHPUnit output
        # Runs even when the suite fails, so the reason is downloadable
        # without admin rights to the raw job log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-output
          path: backend/phpunit_output.log
          if-no-files-found: warn

      - name: Show phpunit log
        if: always()
        run: |
          echo '--- phpunit log ---'
          if [ -f /tmp/phpunit_full.log ]; then
            tail -n 250 /tmp/phpunit_full.log || true
          else
            echo "No phpunit log found (tests were skipped)"
          fi

      - name: Dump error log on failure
        if: failure()
        run: |
          echo '--- storage/logs ---'
          ls -la backend/storage/logs/ || true
          for f in backend/storage/logs/*.log; do echo "===== $f ====="; tail -n 100 "$f" || true; done
          echo '--- phpunit log (if tests ran) ---'
          if [ -f /tmp/phpunit_full.log ]; then
            echo "===== /tmp/phpunit_full.log ====="
            tail -n 100 /tmp/phpunit_full.log || true
          fi

  deploy-production:
    name: Deploy to Production
    needs: [quality, tests, frontend-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install production dependencies (backend)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend for production
        # NOTE: GitHub expressions do NOT support `||` fallbacks, so the old
        # `${{ secrets.VITE_API_URL || '...' }}` was a syntax error. Reference
        # the secret directly; empty is fine (Vite falls back to its default).
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to production over SSH
        # SSH replaces the previous FTP/SFTP deploy (SamKirkland/FTP-Deploy-Action),
        # which had two problems:
        #   1. It required a long-lived PLAINTEXT PASSWORD in repository secrets.
        #      Anyone able to read the repo's Actions configuration, or the
        #      secret list, could read-write /public_html/.
        #   2. FTP is fronted by xinetd (port 21 LISTEN via xinetd, psa-ftpd not
        #      running), so a single connection is spawned per transfer and the
        #      action's server-dir did not match the vhost document root.
        #
        # rsync is run WITHOUT --delete ON PURPOSE. backend/public/ contains
        # .htaccess, index.php, robots.txt, favicon.ico and uploads/ that the
        # build does NOT produce; a --delete sync would destroy them on every
        # deploy. Stale fingerprinted bundles do not accumulate because
        # frontend/scripts/clean-assets.mjs prunes them from the runner before
        # this step uploads.
        #
        # DEPLOY_PATH must be the document root of the app.muwascoerp.co.ke
        # vhost - a DEDICATED subdomain, not the apex:
        #
        #   /var/www/vhosts/muwascoerp.co.ke/httpdocs/
        #       ^^^^^^^^^^^^^^^^^^ the LEGACY procedural PHP app (admin.php,
        #                          apply.php, config.php, ...). None of those
        #                          files exist in this repository. Deploying this
        #                          repo there would overwrite live production.
        #   /var/www/vhosts/app.muwascoerp.co.ke/httpdocs/   <-- this one
        #
        # Confirm after creating the subdomain with:
        #   plesk domain --info app.muwascoerp.co.ke | grep -i document-root
        #   grep -rn DocumentRoot /etc/apache2/sites-enabled/ | grep app
        #
        # Keeping the SPA on its own subdomain is what makes this safe: rsync
        # cannot reach the legacy app, so the separation is enforced by DNS
        # rather than by remembering not to set the wrong path.
        uses: appleboy/rsync-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ./
          target: ${{ vars.DEPLOY_PATH }}
          delete: false
          args: >-
            -avz
            --exclude=.git
            --exclude=node_modules
            --exclude=.env
            --exclude=.env.*
            --exclude=backend/tests
            --exclude=frontend/dist
            --exclude=*.md
            --exclude=backend/docs
            --exclude=frontend/src
            --exclude=backend/storage/logs/*
            --exclude=backend/storage/cache/*
            --exclude=backend/storage/backups/*
          # rsync runs WITHOUT --delete. backend/public/ contains .htaccess,
          # index.php, robots.txt, favicon.ico and uploads/ that the build does
          # NOT produce; a --delete sync would destroy them on every deploy.
          # Stale fingerprinted bundles do not accumulate because
          # frontend/scripts/clean-assets.mjs prunes them on the runner BEFORE
          # this step uploads. A stale hash yields a 404, never wrong code,
          # whereas deleting a live uploads/ file is unrecoverable.
          #
          # NOT excluded, deliberately:
          #   vendor/   composer install runs on the runner above and vendor/ is
          #             gitignored, so it exists ONLY in the workspace. Excluding
          #             it ships no autoloader and every API request fatals
          #             "Class not found".
          #   backend/database/   migration SQL, the record of schema changes.
          #   .env.example / .env.production.example
          #             templates only - harmless, and a useful reference for
          #             whoever writes the live .env.
          #
          # The live .env is EXCLUDED above and must be written by hand on the
          # server; it is never present in the workspace, so nothing to strip.